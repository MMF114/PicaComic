name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate keystore
        working-directory: android/app
        run: |
          keytool -genkey -v -keystore upload.jks -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pica -storepass pica123456 -keypass pica123456 \
            -dname "CN=Pica,OU=Dev,O=Dev,L=City,ST=State,C=CN"
          printf 'storePassword=pica123456\nkeyPassword=pica123456\nkeyAlias=pica\nstoreFile=upload.jks\n' > ../key.properties
          cat ../key.properties

      - name: Build
        run: |
          flutter pub get
          flutter build apk --release

      - name: Show output
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          body: "auto build from ${{ github.sha }}"
          files: build/app/outputs/flutter-apk/*.apk
